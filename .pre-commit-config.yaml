repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: ruff-format-check
        name: Ruff format check
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]
