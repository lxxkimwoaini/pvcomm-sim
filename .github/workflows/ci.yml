name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.13'
      - run: uv python install 3.11.15
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/dev.py lint
      - run: uv run --frozen python scripts/dev.py typecheck
      - run: uv run --frozen python scripts/dev.py test
      - run: uv run --frozen python scripts/generate_schemas.py --check
      - run: uv run --frozen pvcomm validate-config --config configs/foundation.yaml

  data-contracts:
    name: Arrow data contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: '0.11.13'
      - run: uv python install 3.11.15
      - run: uv sync --frozen --group data
      - run: uv run --frozen python scripts/dev.py data-test

  power-models:
    name: Physical models (no network privileges)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: '0.11.13'
      - run: uv python install 3.11.15
      - run: uv sync --frozen --group power
      - run: uv run --frozen python scripts/dev.py power-test

  frontend:
    name: Frontend and browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.13'
      - run: uv python install 3.11.15
      - run: uv sync --frozen
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '11.5.1'
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: uv run --frozen python scripts/dev.py schemas
      - run: uv run --frozen python scripts/dev.py web-test
      - run: uv run --frozen python scripts/dev.py web-build
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm --dir frontend test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure-evidence
          path: frontend/test-results
